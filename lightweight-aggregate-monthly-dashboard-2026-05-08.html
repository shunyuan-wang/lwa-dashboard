// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderSection(secId, items) {
  const grid = document.getElementById('grid' + secId.replace('sec',''));
  const badge = document.getElementById('badge' + secId.replace('sec',''));
  const cnt = document.getElementById('cnt' + secId.replace('sec',''));

  if (!items || items.length === 0) {
    grid.innerHTML = '<div class="empty-state">🔍 本月暫無相關新消息</div>';
    badge.textContent = '0 則';
    if (cnt) cnt.textContent = '0';
    return;
  }

  badge.textContent = items.length + ' 則';
  if (cnt) cnt.textContent = items.length;

  grid.innerHTML = items.map(item => `
    <div class="card" data-text="${escHtml((item.title + ' ' + item.summary).toLowerCase())}">
      <div class="card-top">
        <span class="card-source-tag" title="${escHtml(item.source)}">${escHtml(item.source)}</span>
        <span class="card-date">📅 ${escHtml(item.date)}</span>
      </div>
      <div class="card-title">
        <a href="${escHtml(item.url)}" target="_blank" rel="noopener">${escHtml(item.title)}</a>
      </div>
      <div class="card-summary">💡 ${escHtml(item.summary)}</div>
      <div class="card-footer">
        <a class="card-link" href="${escHtml(item.url)}" target="_blank" rel="noopener">
          查看原文 →
        </a>
      </div>
    </div>
  `).join('');
}

function filterSection(secId, query) {
  const grid = document.getElementById('grid' + secId.replace('sec',''));
  const cards = grid.querySelectorAll('.card');
  const q = query.trim().toLowerCase();
  let visible = 0;
  cards.forEach(card => {
    const match = !q || card.dataset.text.includes(q);
    card.classList.toggle('hidden', !match);
    if (match) visible++;
  });
  // show empty state if all hidden
  let emptyEl = grid.querySelector('.empty-filter');
  if (visible === 0 && q) {
    if (!emptyEl) {
      emptyEl = document.createElement('div');
      emptyEl.className = 'empty-state empty-filter';
      emptyEl.textContent = '沒有符合「' + query + '」的結果';
      grid.appendChild(emptyEl);
    } else {
      emptyEl.textContent = '沒有符合「' + query + '」的結果';
      emptyEl.style.display = '';
    }
  } else if (emptyEl) {
    emptyEl.style.display = 'none';
  }
}
